name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android project
        run: |
          echo "Searching..."
          find . -type f -path "*/app/build.gradle" -print

      - name: Build APK
        run: |
          APP=$(find . -type f -path "*/app/build.gradle" -print -quit)
          if [ -z "$APP" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi
          PROJECT=$(dirname "$(dirname "$APP")")
          echo "Project: $PROJECT"
          cd "$PROJECT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: candle-signal-bot-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error          cd "$PROJECT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: candle-signal-bot-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
