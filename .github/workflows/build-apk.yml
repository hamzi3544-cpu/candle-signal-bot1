name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android project
        shell: bash
        run: |
          APP_FILE=$(find . -type f -name "build.gradle" | grep "/app/" | head -n 1)

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: app/build.gradle not found"
            find . -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_FILE")")

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: candle-signal-bot-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
